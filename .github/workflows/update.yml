name: Seite aktualisieren

on:
  schedule:
    - cron: "23 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:          # Knopf "Run workflow" fuer sofortiges Update
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten von Riot holen
        run: python scripts/build.py
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
